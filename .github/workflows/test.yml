name: research-lab-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/lab.py check
      - run: python scripts/lab.py test
      - run: python scripts/lab.py benchmark RRL-001 --profile smoke
      - run: python scripts/lab.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence-python-${{ matrix.python }}
          path: experiments/results/RRL-001/
          if-no-files-found: ignore
